name: 遷移先ページ スクリーンショット取得

on:
  workflow_dispatch: {} # 手動実行 or 外部(GAS)からのAPI呼び出しのみで起動

jobs:
  capture-screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 日本語フォントのインストール
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk xvfb

      - name: 依存パッケージのインストール
        run: npm install

      - name: Google Chrome(本体)のインストール
        run: npx playwright install --with-deps chrome

      - name: スクリーンショット取得スクリプトを実行(仮想ディスプレイ上でヘッド付き実行)
        env:
          GAS_WEBAPP_URL: ${{ secrets.GAS_WEBAPP_URL }}
          GAS_SHARED_SECRET: ${{ secrets.GAS_SHARED_SECRET }}
        run: xvfb-run --auto-servernum node capture_landing_page_screenshots.js
